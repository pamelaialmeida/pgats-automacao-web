name: End-to-End Tests

on:
  workflow_dispatch:

jobs:
  e2e-tests:

    runs-on: ubuntu-latest

    steps:

      # Clonar projeto para a maquina
      - uses: actions/checkout@v4

      # Confere versao instalada
      - name: Node version
        run: node --version
      
      - name: Instalando dependencias
        run: npm install

      - name: Executando testes
        run: npm test

      - uses: actions/upload-artifact@v4
        if: ${{ ! cancelled() }}
        with: 
          name: relatorios
          path: |
            cypress/reports
            cypress/screenshots
            cypress/videos
